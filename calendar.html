<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracker · Calendar</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Calendar</h1><div class="sub">Placeholder: full rig-move calendar (month / week / terminal lanes) comes in a later mockup.</div><section class="card"><div class="body" id="c"></div></section></main>
<script src="app.js"></script><script>function render(){const d=[...Array(14)].map((_,i)=>addD('2026-11-01',i));$('#c').innerHTML='<div class="week">'+d.map(x=>`<div class="day ${x===TODAY?'today':''}"><div class="d">${dh(x)}</div>${JOBS.filter(inT).filter(j=>j.date===x).map(j=>`<a class="ev" href="${URLS.jobs}">${j.term} ${j.rig}</a>`).join('')}</div>`).join('')+'</div>'}const dh=d=>new Date(d+'T12:00').toLocaleDateString('en-US',{weekday:'short',day:'numeric'});chrome('Calendar');render()</script></body></html>
