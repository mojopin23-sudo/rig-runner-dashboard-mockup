<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracker · Company Documents</title><link rel="stylesheet" href="style.css">
<style>#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px}#modal .card{width:min(720px,100%);height:min(86vh,900px);display:flex;flex-direction:column}.pdf{flex:1;background:#525659;padding:18px;overflow:auto}.pg{background:#fff;max-width:560px;margin:0 auto 14px;padding:36px;min-height:640px;font-size:13px;line-height:1.6}.pg .l{height:9px;background:#e5e5e2;margin:9px 0;border-radius:3px}</style></head>
<body><main><h1>Company Documents</h1><div class="sub" id="sub"></div><input id="q" class="bigsearch" type="search" placeholder="Search documents by title or category…" autofocus><section class="card"><div class="filters">
<label>Category<select id="cat"><option value="">All categories</option></select></label>
<label>Terminal<select id="dt"><option value="all">All terminals</option></select></label><span class="spacer"></span><span id="adm"></span></div><div id="tab"></div></section></main>
<div id="modal" onclick="if(event.target===this)this.style.display='none'"><section class="card"><h2 id="mt"></h2><div class="pdf" id="mb"></div></section></div>
<script src="app.js"></script><script>
const arch=()=>JSON.parse(localStorage.rrArch||'[]');
$('#cat').innerHTML+=CATS.map(c=>`<option>${c}</option>`).join('');$('#dt').innerHTML+=Object.entries(TERMS).map(([a,b])=>`<option value="${a}">${b}</option>`).join('');
function view(i){const d=DOCS[i];$('#mt').innerHTML=d.title+'.pdf <a class="more" href="#" onclick="$(\'#modal\').style.display=\'none\';return false">Close ✕</a>';
 $('#mb').innerHTML=[1,2].map(p=>`<div class="pg"><b style="font-size:18px">${p===1?d.title:''}</b><div class="muted">Rig Runner · ${d.cat} · Rev. ${fd(d.date)} · Page ${p} of 2</div>${'<div class="l"></div>'.repeat(22)}</div>`).join('');$('#modal').style.display='flex'}
function draw(){const q=$('#q').value.toLowerCase(),c=$('#cat').value,t=$('#dt').value,A=arch(),adm=S.role==='Admin';
 const r=DOCS.filter(d=>!A.includes(d.id)&&(!q||(d.title+' '+d.cat).toLowerCase().includes(q))&&(!c||d.cat===c)&&(t==='all'||d.term==='all'||d.term===t));
 $('#tab').innerHTML=table(['Title','Category','Terminal','Updated','Type',''],r.map(d=>[d.title,d.cat,d.term==='all'?'All':TERMS[d.term],fd(d.date),'PDF',`<button class="btn" onclick="view(${d.id})">View</button>`+(adm?` <button class="btn" onclick="archive(${d.id})">Archive</button>`:'')]));
 $('#adm').innerHTML=adm?`<button class="btn primary" onclick="toast('Upload dialog (stub)')">Upload</button>`+(A.length?` <button class="btn" onclick="localStorage.rrArch='[]';draw()">Restore archived (${A.length})</button>`:''):'<span class="muted">Upload / Archive: Admin only</span>';
 $('#sub').textContent=r.length+' documents · viewing as '+S.role}
function archive(i){localStorage.rrArch=JSON.stringify(arch().concat(i));toast('Archived (saved in this browser)');draw()}
function render(){$('#dt').value=S.t;const p=new URLSearchParams(location.search).get('q');if(p&&!$('#q').value)$('#q').value=p;draw()}
$('#q').oninput=draw;$('#cat').onchange=draw;$('#dt').onchange=e=>{S.t=e.target.value;$('#tsel').value=S.t;draw()};
chrome('Documents');render()</script></body></html>
